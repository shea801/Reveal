name: Reveal CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check .

      - name: Install build tools
        run: python -m pip install build

      - name: Build distribution
        run: python -m build

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/reveal-wheel-test
          /tmp/reveal-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/reveal-wheel-test/bin/python -c "import runtime_config; import dashboard.launcher; import mvp.service"
